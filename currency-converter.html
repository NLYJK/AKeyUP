<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert currencies instantly with the AKeyUP Currency Converter. Supports USD, INR, EUR, GBP, JPY, and other few major currencies.">

<title>Currency Converter</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

/* 🔥 Wrapper */

.wrapper{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
}

.title{
  font-size:clamp(2rem,6vw,4rem);
  margin-bottom:30px;
}

/* 🔥 Menu */

.menu-container{
  position:fixed;
  top:clamp(10px,2vw,20px);
  right:clamp(10px,2vw,20px);
  z-index:1000;
}

.menu-btn{
  width:clamp(40px,6vw,60px);
  height:clamp(40px,6vw,60px);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(20px,4vw,36px);

  border:none;
  border-radius:12px;

  background:#222;
  color:white;

  cursor:pointer;

  transition:0.3s;
}

.menu-btn:hover{
  background:#333;
  transform:scale(1.05);
}

.menu{
  display:none;

  margin-top:10px;

  background:#222;

  border-radius:10px;

  overflow:hidden;

  min-width:180px;
}

.menu a{
  display:block;

  padding:12px;

  color:white;

  text-decoration:none;

  font-size:clamp(0.9rem,2vw,1.2rem);
}

.menu a:hover{
  background:#333;
}

/* 🔥 Box */

.box{
  background:#1c1c1c;
  padding:30px;
  border-radius:20px;
}

/* 🔥 Inputs */

select,
input{
  width:100%;

  padding:15px;

  margin:15px 0;

  border:none;
  border-radius:10px;

  background:#222;
  color:white;

  font-size:1rem;
}

/* 🔥 Buttons */

button,
.btn{

  display:inline-block;

  padding:15px 35px;

  border:none;
  border-radius:10px;

  background:#ff4444;
  color:white;

  font-size:1rem;

  text-decoration:none;

  cursor:pointer;

  transition:0.3s;

  margin-top:15px;
}

button:hover,
.btn:hover{
  background:#ff2222;
  transform:scale(1.05);
}

/* 🔥 Result */

.result{
  margin-top:25px;
  font-size:1.5rem;
  color:#00ff88;

  word-wrap:break-word;
}

</style>
</head>

<body>

<script>

function toggleMenu(){

  const menu =
    document.getElementById("menu");

  menu.style.display =
    (menu.style.display === "block")
    ? "none"
    : "block";
}

</script>

<!-- 🔥 Three Dot Menu -->

<div class="menu-container">

  <button class="menu-btn"
          onclick="toggleMenu()">

    ⋮

  </button>

  <div class="menu" id="menu">

    <a href="index.html">Home</a>

    <a href="donation.html">
      Donation
    </a>

    <a href="tool.html">
      Tools
    </a>

    <a href="privacy-policy.html">
      Privacy Policy
    </a>

    <a href="about.html">
      About
    </a>

  </div>

</div>

<div class="wrapper">

<h1 class="title">
💱 Currency Checker
</h1>

<div class="box">

<!-- 🔥 Amount -->

<input type="number"
       id="amount"
       placeholder="Enter Amount"
       value="1">

<!-- 🔥 From -->

<select id="from">

<option value="USD">USD - US Dollar</option>
<option value="INR">INR - Indian Rupee</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
<option value="JPY">JPY - Japanese Yen</option>
<option value="AUD">AUD - Australian Dollar</option>
<option value="CAD">CAD - Canadian Dollar</option>
<option value="CNY">CNY - Chinese Yuan</option>
<option value="RUB">RUB - Russian Ruble</option>
<option value="AED">AED - UAE Dirham</option>
<option value="SAR">SAR - Saudi Riyal</option>
<option value="SGD">SGD - Singapore Dollar</option>
<option value="KRW">KRW - South Korean Won</option>
<option value="CHF">CHF - Swiss Franc</option>
<option value="NZD">NZD - New Zealand Dollar</option>
<option value="BRL">BRL - Brazilian Real</option>
<option value="ZAR">ZAR - South African Rand</option>
<option value="PKR">PKR - Pakistani Rupee</option>
<option value="BDT">BDT - Bangladeshi Taka</option>
<option value="TRY">TRY - Turkish Lira</option>

</select>

<!-- 🔥 To -->

<select id="to">

<option value="INR">INR - Indian Rupee</option>
<option value="USD">USD - US Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
<option value="JPY">JPY - Japanese Yen</option>
<option value="AUD">AUD - Australian Dollar</option>
<option value="CAD">CAD - Canadian Dollar</option>
<option value="CNY">CNY - Chinese Yuan</option>
<option value="RUB">RUB - Russian Ruble</option>
<option value="AED">AED - UAE Dirham</option>
<option value="SAR">SAR - Saudi Riyal</option>
<option value="SGD">SGD - Singapore Dollar</option>
<option value="KRW">KRW - South Korean Won</option>
<option value="CHF">CHF - Swiss Franc</option>
<option value="NZD">NZD - New Zealand Dollar</option>
<option value="BRL">BRL - Brazilian Real</option>
<option value="ZAR">ZAR - South African Rand</option>
<option value="PKR">PKR - Pakistani Rupee</option>
<option value="BDT">BDT - Bangladeshi Taka</option>
<option value="TRY">TRY - Turkish Lira</option>

</select>

<!-- 🔥 Convert -->

<button onclick="convertCurrency()">
Convert Currency
</button>

<!-- 🔥 Result -->

<div class="result"
     id="result">

Result appears here

</div>

</div>

<!--  Button -->

<a href="tool.html"
   class="btn">

⬅ Back to Tools

</a>

</div>

<script>

async function convertCurrency(){

  const amount =
    document.getElementById("amount").value;

  const from =
    document.getElementById("from").value;

  const to =
    document.getElementById("to").value;

  const result =
    document.getElementById("result");

  result.innerHTML =
    "Loading...";

  try{

    const response =
      await fetch(
        `https://api.exchangerate-api.com/v4/latest/${from}`
      );

    const data =
      await response.json();

    const rate =
      data.rates[to];

    const converted =
      (amount * rate).toFixed(2);

    result.innerHTML =

      `${amount} ${from}
       =
       ${converted} ${to}`;

  }

  catch(error){

    result.innerHTML =

      "Failed to fetch currency data.";

  }

}

</script>

</body>
</html>
