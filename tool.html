  <style>
    /* 🔥 Global styles (reuse everywhere) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .wrapper {
      padding: clamp(10px, 4vw, 60px);
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    .title {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: clamp(10px, 2vw, 30px);
    }
   .menu-container {
  position: fixed;
  top: clamp(10px, 2vw, 20px);
  right: clamp(10px, 2vw, 20px);
  z-index: 1000;
}

.menu-btn {
  width: clamp(40px, 6vw, 60px);
  height: clamp(40px, 6vw, 60px);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(20px, 4vw, 36px);
  line-height: 1;

  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  cursor: pointer;

  transition: 0.3s;
}

.menu-btn:hover {
  background: #333;
  transform: scale(1.05);
}/* 🔥 Dropdown menu */
.menu {
  display: none;
  margin-top: 10px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  min-width: 150px;
}

/* 🔥 Menu links */
.menu a {
  display: block;
  padding: 12px;
  color: white;
  text-decoration: none;
  font-size: clamp(0.9rem, 2vw, 1.2rem);
}

.menu a:hover {
  background: #333;
}
.text {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      max-width: 800px;
      margin: auto;
      margin-bottom: clamp(20px, 4vw, 50px);
    }
.btn {
      display: inline-block;
      padding: clamp(10px, 2vw, 18px) clamp(20px, 4vw, 40px);
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      background: #ff4444;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s;
    }
.btn:hover {
      background: #ff2222;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}
</script>
