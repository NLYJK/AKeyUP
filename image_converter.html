<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert images instantly with the AKeyUP Image Converter. Supports JPG, PNG, WEBP, GIF, BMP, and more with fast, simple, and easy-to-use tools.">

<title>AKeyUP Image Converter</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

/* 🔥 Wrapper */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:clamp(15px,4vw,60px);
  text-align:center;
}

/* 🔥 Title */
h1{
  font-size:clamp(2rem,6vw,4rem);
  margin-top:30px;
  margin-bottom:20px;
}

p{
  font-size:clamp(1rem,2vw,1.3rem);
  opacity:0.8;
  margin-bottom:30px;
}

/* 🔥 Menu */
.menu-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
}

.menu-btn{

  width:clamp(42px,6vw,60px);
  height:clamp(42px,6vw,60px);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(22px,4vw,36px);

  border:none;
  border-radius:12px;

  background:#222;
  color:white;

  cursor:pointer;

  transition:0.3s;
}

.menu-btn:hover{
  background:#333;
  transform:scale(1.05);
}

/* 🔥 Dropdown */
.menu{
  display:none;
  margin-top:10px;
  background:#222;
  border-radius:12px;
  overflow:hidden;
  min-width:180px;
}

.menu a{
  display:block;
  padding:14px;
  color:white;
  text-decoration:none;
  font-size:clamp(0.9rem,2vw,1.1rem);
}

.menu a:hover{
  background:#333;
}

/* 🔥 Main converter */
.converter{
  background:#1c1c1c;
  border-radius:20px;
  padding:clamp(20px,4vw,40px);
  margin-top:30px;
}

/* 🔥 Upload area */
.upload-box{
  border:2px dashed #555;
  border-radius:16px;
  padding:clamp(30px,6vw,70px);
}

.upload-box h2{
  margin-bottom:20px;
}

input[type="file"]{
  color:white;
  font-size:1rem;
}

/* 🔥 Preview */
.preview{
  margin-top:30px;
}

.preview img{
  max-width:100%;
  max-height:400px;
  border-radius:14px;
}

/* 🔥 Format dropdown */
select{
  width:min(350px,90%);
  margin-top:30px;
  padding:14px;

  border:none;
  border-radius:12px;

  background:#222;
  color:white;

  font-size:1rem;
}

/* 🔥 Button */
.btn{
  margin-top:30px;

  padding:15px 35px;

  border:none;
  border-radius:12px;

  background:#ff4444;
  color:white;

  font-size:1rem;

  cursor:pointer;

  transition:0.3s;
}

.btn:hover{
  background:#ff2222;
  transform:scale(1.05);
}

/* 🔥 Footer */
footer{
  margin-top:50px;
  padding-bottom:20px;
  opacity:0.7;
  font-size:0.9rem;
}

</style>
</head>

<body>

<!-- 🔥 MENU -->
<div class="menu-container">

  <button class="menu-btn" onclick="toggleMenu()">⋮</button>

  <div class="menu" id="menu">

    <a href="index.html">Home</a>
    <a href="donation.html">Donation</a>
    <a href="tool.html">Tools</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="about.html">About</a>

  </div>

</div>

<div class="wrapper">

  <h1>Image Converter</h1>

  <p>
    Upload images and convert them instantly in your browser.
  </p>
  <p>
     Do not refresh until image starts downloading otherwise it may interrupt the process.
  </p>

  <div class="converter">

    <!-- 🔥 Upload -->
    <div class="upload-box">

      <h2>Select Image</h2>

      <input type="file" id="imageInput" accept="image/*">

      <div class="preview">
        <img id="previewImage" style="display:none;">
      </div>

    </div>

    <!-- 🔥 Format -->
    <select id="formatSelect">

      <option value="png">PNG</option>
      <option value="jpeg">JPG / JPEG</option>
      <option value="webp">WEBP</option>
      <option value="bmp">BMP</option>
      <option value="gif">GIF</option>
      <option value="avif">AVIF</option>
      <option value="ico">ICO</option>
      <option value="tiff">TIFF</option>

    </select>

    <br>

    <!-- 🔥 Convert -->
    <button class="btn" onclick="convertImage()">

      Convert & Download

    </button>

  </div>

  <footer>
    © 2026 AKeyUP
  </footer>

</div>

<script>

/* 🔥 Menu */
function toggleMenu(){

  const menu = document.getElementById("menu");

  if(menu.style.display === "block"){

    menu.style.display = "none";

  }else{

    menu.style.display = "block";
  }
}

/* 🔥 Image preview */

const imageInput = document.getElementById("imageInput");

const previewImage = document.getElementById("previewImage");

let uploadedImage = null;

imageInput.addEventListener("change", function(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    uploadedImage = new Image();

    uploadedImage.src = e.target.result;

    previewImage.src = e.target.result;

    previewImage.style.display = "block";
  };

  reader.readAsDataURL(file);
});

/* 🔥 Convert image */

function convertImage(){

  if(!uploadedImage){

    alert("Please upload an image first.");

    return;
  }

  const format = document.getElementById("formatSelect").value;

  const canvas = document.createElement("canvas");

  const ctx = canvas.getContext("2d");

  canvas.width = uploadedImage.width;

  canvas.height = uploadedImage.height;

  ctx.drawImage(uploadedImage, 0, 0);

  let mimeType = "image/png";

  switch(format){

    case "png":
      mimeType = "image/png";
      break;

    case "jpeg":
      mimeType = "image/jpeg";
      break;

    case "webp":
      mimeType = "image/webp";
      break;

    case "bmp":
      mimeType = "image/bmp";
      break;

    case "gif":
      mimeType = "image/gif";
      break;

    case "avif":
      mimeType = "image/avif";
      break;

    case "ico":
      mimeType = "image/x-icon";
      break;

    case "tiff":
      mimeType = "image/tiff";
      break;

    default:
      mimeType = "image/png";
  }

  try{

    const convertedImage = canvas.toDataURL(mimeType);

    const link = document.createElement("a");

    link.href = convertedImage;

    link.download = "converted-image." + format;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  }catch(error){

    alert("This format is not supported in your browser.");
  }
}

</script>

</body>
</html>
