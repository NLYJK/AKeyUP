<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Meta Description -->
<meta name="description" content="Donate Bitcoin if you found the website or AKeyUP useful.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6438029552227591"
     crossorigin="anonymous"></script>


<title>Donation</title>

<style>

/* 🔥 Reset */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  line-height:1.6;
}

/* 🔥 Layout */
.wrapper{
  max-width:900px;
  margin:auto;
  padding:clamp(20px,5vw,60px);
  text-align:center;
}

.title{
  font-size:clamp(2rem,6vw,4rem);
  margin-bottom:20px;
}

.text{
  font-size:clamp(1rem,2.2vw,1.4rem);
  max-width:700px;
  margin:auto;
  margin-bottom:30px;
}

/* 🔥 Menu */
.menu-container{
  position:fixed;
  top:15px;
  right:15px;
  z-index:999;
}

.menu-btn{
  font-size:24px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  cursor:pointer;
}

.menu{
  display:none;
  margin-top:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  min-width:180px;
}

.menu.show{
  display:block;
}

.menu a{
  display:block;
  padding:14px;
  color:white;
  text-decoration:none;
}

.menu a:hover{
  background:#333;
}

/* 🔥 Coin box */
.coin{
  background:#222;
  padding:25px;
  border-radius:15px;
  margin-top:25px;
}

/* 🔥 Image fix */
.logo{
  width:100%;
  max-width:120px;
  height:auto;
  display:block;
  margin:0 auto 15px auto;
  object-fit:contain;
}

/* 🔥 Button */
.btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 25px;
  font-size:1rem;
  background:#ff4444;
  color:white;
  border:none;
  border-radius:10px;
  text-decoration:none;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#ff2222;
  transform:scale(1.05);
}

/* 🔥 Back button spacing */
.back{
  margin-top:40px;
  display:inline-block;
}

</style>
</head>

<body>

<!-- 🔥 MENU FIX (Edge + Chrome safe) -->
<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
}
</script>

<script>
function copy(id){
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text)
    .then(()=>alert("Address copied!"))
    .catch(()=>alert("Copy failed"));
}
</script>

<!-- 🔥 Menu -->
<div class="menu-container">
  <button class="menu-btn" onclick="toggleMenu()">⋮</button>

  <div class="menu" id="menu">
    <a href="index.html">Home</a>
    <a href="donation.html">Donation</a>
    <a href="tool.html">Tools</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="about.html">About</a>
  </div>
</div>

<!-- 🔥 Content -->
<div class="wrapper">

  <h1 class="title">AKeyUP Donation</h1>

  <p class="text">
    Help support future projects by donating.
  </p>

  <!-- 🪙 Bitcoin -->
  <div class="coin">

    <!-- 🔥 IMAGE FIX -->
    <img src="btc.avif" alt="Bitcoin Logo" class="logo">

    <h2>Bitcoin (BTC)</h2>

    <p style="color:#aaa;">Send only via Bitcoin network</p>

    <p id="btc" style="word-break:break-all;">
      19okdn9UMfjG95ieFvhRLR4cMkMcYHmhFh
    </p>

    <button class="btn" onclick="copy('btc')">
      Copy Address
    </button>

  </div>

  <a href="index.html" class="btn back">⬅ Back to Home</a>

</div>
<!-- 🔥 Privacy Popup -->

<style>

/* 🔥 Privacy Popup */

.privacy-popup{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.75);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:9999;

  padding:20px;
}

.privacy-box{

  background:#1c1c1c;

  width:min(420px,100%);

  padding:35px;

  border-radius:24px;

  text-align:center;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.5);

  animation:
  popupFade 0.3s ease;
}

.privacy-box h2{

  font-size:2rem;

  margin-bottom:15px;

  color:white;
}

.privacy-box p{

  color:#aaaaaa;

  line-height:1.8;

  font-size:1rem;
}

.privacy-box a{

  color:#4da6ff;

  text-decoration:none;

  font-weight:bold;
}

.privacy-box a:hover{

  text-decoration:underline;
}

.accept-btn{

  margin-top:25px;

  padding:14px 30px;

  border:none;

  border-radius:14px;

  background:#ff4444;

  color:white;

  font-size:1rem;

  font-weight:bold;

  cursor:pointer;

  transition:0.25s;
}

.accept-btn:hover{

  background:#ff2222;

  transform:scale(1.05);
}

/* 🔥 Animation */

@keyframes popupFade{

  from{

    opacity:0;

    transform:scale(0.9);
  }

  to{

    opacity:1;

    transform:scale(1);
  }
}

</style>

<div
class="privacy-popup"
id="privacyPopup">

  <div class="privacy-box">

    <h2>
      Privacy Notice
    </h2>

    <p>

      By using AKeyUP, you agree to our

      <a href="privacy-policy.html">

        Privacy Policy

      </a>.

    </p>

    <button
    class="accept-btn"
    onclick="acceptPrivacy()">

      Accept

    </button>

  </div>

</div>

<script>

/* 🔥 Accept */

function acceptPrivacy(){

  localStorage.setItem(
    "privacyAccepted",
    "true"
  );

  document.getElementById(
    "privacyPopup"
  ).style.display = "none";
}

/* 🔥 Check */

window.addEventListener(
"load",
function(){

  const accepted =
  localStorage.getItem(
    "privacyAccepted"
  );

  if(accepted === "true"){

    document.getElementById(
      "privacyPopup"
    ).style.display = "none";
  }
});

</script>
</body>
</html>
