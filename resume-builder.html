<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKeyUP Resume Builder | Professional ATS CV Maker</title>

<meta name="description" content="Build professional ATS-friendly resumes with live preview, templates, and PDF export.">

<meta name="keywords" content="resume builder, CV maker, ATS resume, online resume builder, AKeyUP tools">

<meta name="author" content="AKeyUP">

<meta name="robots" content="index, follow">

<meta name="theme-color" content="#111">

<!-- PDF LIBS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#111;
  color:white;
}

/* =========================
   MENU (Notes-style)
========================= */
.menu-container{
  position:fixed;
  top:15px;
  right:15px;
  z-index:9999;
}

.menu-btn{
  width:50px;
  height:50px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:24px;
  cursor:pointer;
}

.menu{
  display:none;
  margin-top:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  min-width:180px;
}

.menu a{
  display:block;
  padding:12px;
  color:white;
  text-decoration:none;
}

.menu a:hover{
  background:#333;
}

/* =========================
   LAYOUT
========================= */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.title{
  text-align:center;
  font-size:2.5rem;
  margin-bottom:20px;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* =========================
   BOXES
========================= */
.box{
  background:#1c1c1c;
  padding:20px;
  border-radius:15px;
}

/* =========================
   INPUTS
========================= */
input, textarea, select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}

/* =========================
   BUTTONS
========================= */
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#ff4444;
  color:white;
  cursor:pointer;
  margin:5px 0;
}

button:hover{
  background:#ff2222;
}

/* =========================
   RESUME PREVIEW
========================= */
.resume{
  background:white;
  color:black;
  padding:20px;
  border-radius:10px;
  min-height:500px;
}

/* =========================
   PRIVACY POPUP (your system)
========================= */
.privacy-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
  padding:20px;
}

.privacy-box{
  background:#1c1c1c;
  width:min(420px,100%);
  padding:35px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
  animation:popupFade 0.3s ease;
}

.privacy-box h2{
  font-size:2rem;
  margin-bottom:15px;
  color:white;
}

.privacy-box p{
  color:#aaaaaa;
  line-height:1.8;
  font-size:1rem;
}

.privacy-box a{
  color:#4da6ff;
  text-decoration:none;
  font-weight:bold;
}

.accept-btn{
  margin-top:25px;
  padding:14px 30px;
  border:none;
  border-radius:14px;
  background:#ff4444;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.accept-btn:hover{
  background:#ff2222;
  transform:scale(1.05);
}

@keyframes popupFade{
  from{opacity:0;transform:scale(0.9);}
  to{opacity:1;transform:scale(1);}
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<!-- =========================
     MENU
========================= -->
<div class="menu-container">

<button class="menu-btn" onclick="toggleMenu()">⋮</button>

<div class="menu" id="menu">
  <a href="index.html">Home</a>
  <a href="donation.html">Donation</a>
  <a href="tool.html">Tools</a>
  <a href="about.html">About</a>
  <a href="privacy-policy.html">Privacy Policy</a>
</div>

</div>

<!-- =========================
     TITLE
========================= -->
<div class="wrapper">

<h1 class="title">🧾 AKeyUP Resume Builder</h1>

<div class="container">

<!-- =========================
     EDITOR
========================= -->
<div class="box">

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">

<!-- 🌍 COUNTRY -->
<input list="countryList" id="countryInput" placeholder="🌍 Select Country">
<datalist id="countryList"></datalist>

<input id="phone" placeholder="Phone Number">

<textarea id="summary" placeholder="Summary"></textarea>
<input id="skills" placeholder="Skills">
<input id="education" placeholder="Education">
<input id="experience" placeholder="Experience">

<select id="template" onchange="setTemplate()">
  <option value="classic">Classic</option>
  <option value="modern">Modern</option>
</select>

<button onclick="save()">💾 Save</button>
<button onclick="clearAll()">🗑 Clear</button>
<button onclick="downloadPDF()">📄 Export PDF</button>

<p id="status"></p>

</div>

<!-- =========================
     PREVIEW
========================= -->
<div class="box">

<h2>Live Preview</h2>

<div class="resume" id="resume">

<h2 id="pName">Name</h2>
<p id="pContact"></p>

<h3>Summary</h3>
<p id="pSummary"></p>

<h3>Skills</h3>
<p id="pSkills"></p>

<h3>Education</h3>
<p id="pEducation"></p>

<h3>Experience</h3>
<p id="pExperience"></p>

</div>

</div>

</div>

</div>

<!-- =========================
     PRIVACY POPUP
========================= -->
<div class="privacy-popup" id="privacyPopup">

<div class="privacy-box">

<h2>Privacy Notice</h2>

<p>
 By clicking on this,You agree to our <a href="privacy-policy.html">Privacy Policy</a>.
</p>

<button class="accept-btn" onclick="acceptPrivacy()">Accept</button>

</div>

</div>

<script>

/* =========================
   MENU
========================= */
function toggleMenu(){
  const m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

/* =========================
   PRIVACY
========================= */
function acceptPrivacy(){
  localStorage.setItem("privacyAccepted","true");
  privacyPopup.style.display="none";
}

window.addEventListener("load", () => {
  if(localStorage.getItem("privacyAccepted")==="true"){
    privacyPopup.style.display="none";
  }
  load();
  update();
});

/* =========================
   GLOBAL COUNTRIES (compact but real-world coverage)
========================= */
const countries = [
["Afghanistan","+93"],["Albania","+355"],["Algeria","+213"],["Argentina","+54"],
["Australia","+61"],["Austria","+43"],["Bangladesh","+880"],["Belgium","+32"],
["Brazil","+55"],["Canada","+1"],["China","+86"],["Egypt","+20"],
["France","+33"],["Germany","+49"],["India","+91"],["Indonesia","+62"],
["Italy","+39"],["Japan","+81"],["Kenya","+254"],["Mexico","+52"],
["Nepal","+977"],["Netherlands","+31"],["Nigeria","+234"],["Pakistan","+92"],
["Philippines","+63"],["Russia","+7"],["Saudi Arabia","+966"],["South Africa","+27"],
["South Korea","+82"],["Spain","+34"],["Sri Lanka","+94"],["Sweden","+46"],
["Switzerland","+41"],["Thailand","+66"],["Turkey","+90"],["UAE","+971"],
["United Kingdom","+44"],["United States","+1"],["Vietnam","+84"]
];

function loadCountries(){
  const list = countryList;
  countries.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = `${c[0]} (${c[1]})`;
    list.appendChild(opt);
  });
}
loadCountries();

/* =========================
   SMART PHONE AUTO CODE
========================= */
countryInput.addEventListener("input", () => {

  const match = countries.find(c =>
    countryInput.value.includes(c[0])
  );

  if(match && !phone.value.startsWith("+")){
    phone.value = match[1] + " ";
  }

});

/* =========================
   LIVE PREVIEW
========================= */
document.querySelectorAll("input, textarea").forEach(el=>{
  el.addEventListener("input", update);
});

function update(){

  const code = phone.value.startsWith("+") ? "" : "";

  pName.innerText = name.value || "Name";

  pContact.innerText =
    `${email.value} | ${phone.value}`;

  pSummary.innerText = summary.value;
  pSkills.innerText = skills.value;
  pEducation.innerText = education.value;
  pExperience.innerText = experience.value;
}

/* =========================
   SAVE / LOAD
========================= */
function save(){

  const data = {
    name:name.value,
    email:email.value,
    phone:phone.value,
    country:countryInput.value,
    summary:summary.value,
    skills:skills.value,
    education:education.value,
    experience:experience.value
  };

  localStorage.setItem("resume_data", JSON.stringify(data));
  status.innerText="Saved locally ✔";
}

function load(){

  const data = JSON.parse(localStorage.getItem("resume_data"));

  if(!data) return;

  name.value=data.name||"";
  email.value=data.email||"";
  phone.value=data.phone||"";
  countryInput.value=data.country||"";
  summary.value=data.summary||"";
  skills.value=data.skills||"";
  education.value=data.education||"";
  experience.value=data.experience||"";
}

/* =========================
   CLEAR
========================= */
function clearAll(){
  localStorage.removeItem("resume_data");
  document.querySelectorAll("input, textarea").forEach(e=>e.value="");
  update();
}

/* =========================
   TEMPLATE
========================= */
function setTemplate(){
  resume.style.borderLeft =
    template.value==="modern"
    ? "6px solid #ff4444"
    : "none";
}

/* =========================
   PDF EXPORT
========================= */
async function downloadPDF(){

  const { jsPDF } = window.jspdf;

  const canvas = await html2canvas(resume);

  const img = canvas.toDataURL("image/png");

  const pdf = new jsPDF("p","mm","a4");

  pdf.addImage(img,"PNG",0,0,210,297);

  pdf.save("AKeyUP_Resume.pdf");
}

</script>

</body>
</html>
